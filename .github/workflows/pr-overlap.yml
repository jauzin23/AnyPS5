name: PR overlap validation

on:
  push:
    branches: [ci/verify-pr-21136]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check function ownership and branch overlap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/pr_overlap.py --repo boykopovar/AnyPS5 --base main --names changed_lines --jobs 2
          python3 tools/pr_overlap.py --repo boykopovar/AnyPS5 --base main --branch 09468dd25fd5ccbcda92f5c9e832b7e50a0cc6e1 --jobs 2
